
name: Build TechReserve Analytics

on:
  push:
    branches:
      - main_repair
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics-service/requirements.txt

      - name: Install analytics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r analytics-service/requirements.txt

      - name: Run analytics unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: analytics-service
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/techreserve_test
        run: |
          python -m unittest discover \
            -s analytics-service/tests \
            -p 'test_*.py' \
            -v

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push analytics image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./analytics-service/Dockerfile
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/techreserve/analytics:${{ github.sha }}
