
name: Deploy TechReserve to Azure

on:
  workflow_run:
    workflows:
      - Build TechReserve Frontend
      - Build TechReserve Backend
      - Build TechReserve Analytics
    types:
      - completed
    branches:
      - main_repair

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy existing images
        env:
          ACR: ${{ vars.ACR_NAME }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          FRONTEND: ${{ vars.FRONTEND_APP_NAME }}
          BACKEND: ${{ vars.BACKEND_APP_NAME }}
          ANALYTICS: ${{ vars.ANALYTICS_APP_NAME }}
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          az containerapp update \
            --name "$BACKEND" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/techreserve/backend:$IMAGE_SHA"

          az containerapp update \
            --name "$ANALYTICS" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/techreserve/analytics:$IMAGE_SHA"

          az containerapp update \
            --name "$FRONTEND" \
            --resource-group "$RG" \
            --image "$ACR.azurecr.io/techreserve/frontend:$IMAGE_SHA"
