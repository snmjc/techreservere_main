name: Deploy TechReserve

on:
  push:
    branches: ["main_repair"]

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/techreserve_deploy_key
          chmod 600 ~/.ssh/techreserve_deploy_key

          ssh -i ~/.ssh/techreserve_deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "
              set -e

              cd /opt/techreserve

              git fetch origin ${{ env.DEPLOY_BRANCH }}
              git reset --hard origin/${{ env.DEPLOY_BRANCH }}

              attempts=0
              until [ \$attempts -ge 3 ]
              do
                if docker compose -f compose.prod.yml build --pull; then
                  break
                fi

                attempts=\$((attempts + 1))
                if [ \$attempts -ge 3 ]; then
                  exit 1
                fi

                sleep 10
              done

              docker compose -f compose.prod.yml up -d

              backend_attempts=0
              until docker compose -f compose.prod.yml exec -T backend php bin/console about --env=prod >/dev/null 2>&1
              do
                backend_attempts=\$((backend_attempts + 1))
                if [ \$backend_attempts -ge 12 ]; then
                  docker compose -f compose.prod.yml ps
                  docker compose -f compose.prod.yml logs --tail=100 backend frontend analytics-service
                  exit 1
                fi

                sleep 5
              done

              docker compose -f compose.prod.yml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod

              docker compose -f compose.prod.yml ps
            "
