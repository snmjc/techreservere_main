name: Deploy TechReserve

on:
  push:
    branches: ["main_repair"]

jobs:
  deploy:
    name: Deploy to DigitalOcean Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/techreserve_deploy_key
          chmod 600 ~/.ssh/techreserve_deploy_key

          ssh -i ~/.ssh/techreserve_deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} "
              set -e

              cd /opt/techreserve

              git fetch origin main
              git reset --hard origin/main

              attempts=0
              until [ \$attempts -ge 3 ]
              do
                if docker compose -f compose.prod.yml build --pull; then
                  break
                fi

                attempts=\$((attempts + 1))
                if [ \$attempts -ge 3 ]; then
                  exit 1
                fi

                sleep 10
              done

              docker compose -f compose.prod.yml up -d

              docker compose -f compose.prod.yml exec -T backend php bin/console doctrine:migrations:migrate --no-interaction --env=prod

              docker compose -f compose.prod.yml ps
            "
